name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore .\ChatGPTRoster.sln --locked-mode

      - name: Build Release
        run: dotnet build .\ChatGPTRoster.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test .\ChatGPTRoster.sln --configuration Release --no-build --logger "trx;LogFileName=ChatGPTRoster.trx"

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: .\scripts\Test-PackageVulnerabilities.ps1

      - name: Scan repository for secrets and personal data
        shell: pwsh
        run: .\scripts\Test-RepositorySafety.ps1

      - name: Build self-contained package
        shell: pwsh
        id: package
        run: |
          $project = [xml](Get-Content .\src\ChatGPTRoster\ChatGPTRoster.csproj)
          $version = $project.Project.PropertyGroup.Version
          .\scripts\Build-Release.ps1 -Version $version -SkipTests
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: RosterCompanion-${{ steps.package.outputs.version }}-win-x64
          path: |
            artifacts/${{ steps.package.outputs.version }}/RosterCompanion-${{ steps.package.outputs.version }}-win-x64/RosterCompanion.exe
            artifacts/${{ steps.package.outputs.version }}/RosterCompanion-${{ steps.package.outputs.version }}-win-x64.zip
            artifacts/${{ steps.package.outputs.version }}/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
