name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore .\ChatGPTRoster.sln --locked-mode

      - name: Build Release
        run: dotnet build .\ChatGPTRoster.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test .\ChatGPTRoster.sln --configuration Release --no-build --logger "trx;LogFileName=ChatGPTRoster.trx"

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: .\scripts\Test-PackageVulnerabilities.ps1

      - name: Scan repository for secrets and personal data
        shell: pwsh
        run: .\scripts\Test-RepositorySafety.ps1

      - name: Build self-contained package
        shell: pwsh
        run: .\scripts\Build-Release.ps1 -Version 0.1.0 -SkipTests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RosterCompanion-0.1.0-win-x64
          path: |
            artifacts/0.1.0/RosterCompanion-0.1.0-win-x64.zip
            artifacts/0.1.0/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
